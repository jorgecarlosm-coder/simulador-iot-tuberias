
name: Prueba del modelo hidraulico

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener archivos
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar NumPy
        run: pip install numpy

      - name: Ejecutar prueba
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "modelos")

          from modelo_hidraulico import modelo_hidraulico

          r = modelo_hidraulico(
              longitud=100,
              diametro=0.05,
              caudal=0.001,
              presion_entrada=300000,
              rho=998.2,
              mu=0.001002,
              rugosidad=0.0000015
          )

          for nombre, valor in r.items():
              print(nombre, "=", valor)

          assert r["area"] > 0
          assert r["velocidad"] > 0
          assert r["reynolds"] > 0
          assert r["factor_friccion"] > 0
          assert r["perdida_presion"] > 0
          assert r["presion_salida"] > 0

          print("MODELO HIDRAULICO FUNCIONA CORRECTAMENTE")
          PY

      - name: Ejecutar modelo de sensores
        run: |
          python - <<'PY'
          import sys
          import numpy as np

          sys.path.insert(0, "modelos")

          from modelo_sensores import (
              simular_sensor_mc,
              configurar_sensor
          )

          # Configuracion del sensor
          parametros = configurar_sensor("temperatura")

          # Valores reales de temperatura
          temperaturas = np.array([
              20, 25, 30, 35, 40, 45, 50
          ])

          # Generador aleatorio reproducible
          rng = np.random.default_rng(42)

          # Simulacion
          mediciones = simular_sensor_mc(
              valor_real=temperaturas,
              parametros=parametros,
              dt=1,
              rng=rng
          )

          print("RESULTADOS DEL SENSOR")
          print("-----------------------------")

          for real, medido in zip(temperaturas, mediciones):
              print(
                  f"Real: {real:.2f} °C | "
                  f"Medido: {medido:.2f} °C"
              )

          # Comprobaciones
          assert len(mediciones) == len(temperaturas)
          assert np.all(np.isfinite(mediciones))

          # Prueba determinista sin ruido ni sesgo
          parametros_prueba = {
              "bias": 0,
              "ruido_std": 0,
              "resolucion": 0.1,
              "tau": 0
          }

          rng_prueba = np.random.default_rng(1)

          resultado = simular_sensor_mc(
              valor_real=np.array([20.13, 25.27, 30.34]),
              parametros=parametros_prueba,
              dt=1,
              rng=rng_prueba
          )

          esperado = np.array([20.1, 25.3, 30.3])

          assert np.allclose(resultado, esperado)

          print("-----------------------------")
          print("MODELO DE SENSORES FUNCIONA CORRECTAMENTE")
          PY

      - name: Ejecutar modelo de fallas
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "modelos")

          from modelo_fallas import modelo_fallas

          parametros = {
              "longitud": 100,
              "diametro": 0.05,
              "caudal": 0.001,
              "presion_entrada": 300000,
              "rho": 998.2,
              "mu": 0.001002,
              "rugosidad": 0.0000015,
              "coeficiente_U": 5,
              "temperatura_entrada": 60,
              "temperatura_ambiente": 20,
              "cp": 4182
          }

          fallas = [
              "normal",
              "fuga",
              "obstruccion",
              "perdida_aislamiento",
              "sobrecalentamiento"
          ]

          print("COMPROBACION DE FALLAS")
          print("--------------------------------")

          for falla in fallas:

              resultado = modelo_fallas(
                  tipo_falla=falla,
                  parametros=parametros
              )

              modificados = resultado["parametros_modificados"]
              detalles = resultado["detalles"]

              print("\nFalla:", falla)
              print("Descripcion:", detalles["descripcion"])

              if falla == "fuga":
                  assert modificados["caudal"] < parametros["caudal"]
                  print("Caudal de salida:", modificados["caudal"])

              elif falla == "obstruccion":
                  assert modificados["diametro"] < parametros["diametro"]
                  print("Diametro efectivo:", modificados["diametro"])

              elif falla == "perdida_aislamiento":
                  assert modificados["coeficiente_U"] > parametros["coeficiente_U"]
                  print("Nuevo coeficiente U:", modificados["coeficiente_U"])

              elif falla == "sobrecalentamiento":
                  assert modificados["temperatura_entrada"] > parametros["temperatura_entrada"]
                  print("Nueva temperatura:", modificados["temperatura_entrada"])

              elif falla == "normal":
                  assert modificados == parametros

          # Comprobar que el modelo no altere los parametros originales
          assert parametros["caudal"] == 0.001
          assert parametros["diametro"] == 0.05

          print("\n--------------------------------")
          print("MODELO DE FALLAS FUNCIONA CORRECTAMENTE")
          PY

      - name: Ejecutar modelo de deteccion
        run: |
          python - <<'PY'
          import sys
          import numpy as np

          sys.path.insert(0, "modelos")

          from deteccion import (
              detectar_umbral,
              detectar_residuos,
              calcular_metricas,
              calcular_retardo_deteccion
          )

          # Mediciones de ejemplo
          referencias = np.array([20, 20, 20, 20, 20])
          mediciones = np.array([20, 20.5, 20.2, 30, 31])

          # Metodo de umbrales
          alarmas_umbral = detectar_umbral(
              mediciones,
              referencias,
              tolerancia=2
          )

          # Metodo basado en residuos
          alarmas_residuos = detectar_residuos(
              mediciones,
              referencias,
              sigma_residuo=0.5,
              umbral_sigma=3
          )

          print("RESULTADOS DE DETECCION")
          print("--------------------------------")

          print("Alarmas por umbral:", alarmas_umbral)
          print("Alarmas por residuos:", alarmas_residuos)

          # Comprobacion de las alarmas
          esperado = np.array([False, False, False, True, True])

          assert np.array_equal(alarmas_umbral, esperado)
          assert np.array_equal(alarmas_residuos, esperado)

          # Etiquetas reales:
          # 0 = normal
          # 1 = falla
          y_real = np.array([0, 0, 0, 1, 1])

          metricas = calcular_metricas(
              y_real,
              alarmas_residuos
          )

          print("\nMETRICAS")
          for nombre, valor in metricas.items():
              print(nombre, "=", valor)

          assert metricas["VP"] == 2
          assert metricas["VN"] == 3
          assert metricas["FP"] == 0
          assert metricas["FN"] == 0
          assert metricas["f1"] == 1.0

          # Prueba del retardo
          tiempos = np.array([0, 1, 2, 3, 4])

          falla_real = np.array([0, 0, 1, 1, 1])
          falla_detectada = np.array([0, 0, 0, 1, 1])

          retardo = calcular_retardo_deteccion(
              tiempos,
              falla_real,
              falla_detectada
          )

          print("\nRetardo de deteccion:", retardo, "segundos")

          assert retardo == 1.0

          print("--------------------------------")
          print("MODELO DE DETECCION FUNCIONA CORRECTAMENTE")
          PY

      - name: Ejecutar modelo de comunicacion IoT
        run: |
          python - <<'PY'
          import sys
          import numpy as np

          sys.path.insert(0, "modelos")

          from comunicacion_iot import simular_comunicacion

          arquitecturas = [
              "lorawan",
              "lora_mesh",
              "wifi",
              "hibrida"
          ]

          print("COMPARACION DE ARQUITECTURAS IoT")
          print("--------------------------------")

          for arquitectura in arquitecturas:

              rng = np.random.default_rng(42)

              resultado = simular_comunicacion(
                  arquitectura=arquitectura,
                  distancia_km=2,
                  cantidad_paquetes=1000,
                  intervalo_transmision_s=60,
                  bateria_mAh=5000,
                  voltaje=3.7,
                  rng=rng
              )

              print("\nArquitectura:", resultado["arquitectura"])
              print("PDR estimado:", resultado["pdr_estimado"])
              print("PDR observado:", resultado["pdr_observado"])
              print("Paquetes entregados:", resultado["paquetes_entregados"])
              print("Paquetes perdidos:", resultado["paquetes_perdidos"])
              print("Latencia:", resultado["latencia_ms"], "ms")
              print("Saltos:", resultado["saltos"])
              print("Corriente promedio:", resultado["corriente_promedio_mA"], "mA")
              print("Autonomia:", resultado["autonomia_dias"], "dias")

              assert 0 <= resultado["pdr_estimado"] <= 1
              assert 0 <= resultado["pdr_observado"] <= 1
              assert resultado["paquetes_entregados"] + resultado["paquetes_perdidos"] == 1000
              assert resultado["latencia_ms"] > 0
              assert resultado["autonomia_dias"] > 0

          print("\n--------------------------------")
          print("MODELO DE COMUNICACION IoT FUNCIONA CORRECTAMENTE")
          PY

      - name: Ejecutar modelo termico
        run: |
          python - <<'PY'
          import sys
          import numpy as np

          sys.path.insert(0, "modelos")

          from modelo_termico import modelo_termico

          resultados = modelo_termico(
              temperatura_entrada=60,
              temperatura_ambiente=20,
              longitud=100,
              diametro=0.05,
              coeficiente_U=5,
              caudal=0.001,
              rho=998.2,
              cp=4182,
              numero_puntos=101
          )

          print("RESULTADOS DEL MODELO TERMICO")
          print("--------------------------------")

          print("Caudal masico:", resultados["caudal_masico"])
          print("Temperatura inicial:", resultados["temperaturas"][0])
          print("Temperatura a mitad de tuberia:", resultados["temperaturas"][50])
          print("Temperatura final:", resultados["temperatura_salida"])
          print("Variacion termica:", resultados["variacion_temperatura"])

          # Comprobaciones
          assert len(resultados["distancias"]) == 101
          assert len(resultados["temperaturas"]) == 101

          assert np.isclose(resultados["temperaturas"][0], 60)

          assert resultados["temperatura_salida"] < 60
          assert resultados["temperatura_salida"] > 20

          assert np.all(np.diff(resultados["temperaturas"]) <= 0)

          print("--------------------------------")
          print("MODELO TERMICO FUNCIONA CORRECTAMENTE")
          PY

      - name: Ejecutar experimento H1
        run: |
          python -m experimentos.experimento_H1

      - name: Ejecutar experimento H2
        run: |
          python -m experimentos.experimento_H2

      - name: Ejecutar experimento H3
        run: |
          python -m experimentos.experimento_H3

      - name: Ejecutar experimento H4
        run: |
          python -m experimentos.experimento_H4
